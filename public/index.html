<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resolve · CIWT</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:#000;color:#f1f1f5;font-family:Outfit,Inter,system-ui,sans-serif;min-height:100vh}
.g{background:linear-gradient(90deg,#a78bfa,#f0abfc)}
.gt{background:linear-gradient(90deg,#a78bfa,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent}
:focus-visible{outline:2px solid #f0abfc;outline-offset:2px}
</style></head>
<body>
<div id="app"></div><div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50"></div>
<script>
const CATS=['Electrical','Plumbing','Furniture','Cleaning','Network','Others'],PRI=['Low','Medium','High','Critical'];
const need=(c,m)=>{if(!c)throw new Error(m)};
const ESC={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'},esc=s=>String(s??'').replace(/[&<>"']/g,c=>ESC[c]);
const day=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const FMT=new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}),fmt=s=>FMT.format(new Date(s));
const FMTD=new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'short',year:'numeric'}),fd=s=>FMTD.format(new Date(s+'T00:00'));
const USERS=[{id:'a',name:'Admin',email:'admin@nitc.ac.in',pw:'admin123',role:'A'},{id:'u1',name:'Aarav Nair',email:'aarav@nitc.ac.in',pw:'user123',role:'U'},{id:'u2',name:'Meera Pillai',email:'meera@nitc.ac.in',pw:'user123',role:'U'},{id:'u3',name:'Dr. Kiran Das',email:'kiran@nitc.ac.in',pw:'user123',role:'U'}];
const S={me:null,issues:[],wos:[],pu:[],notes:[],photos:[],f:{q:'',st:'',cat:'',pr:''},wf:{q:'',st:'',pr:'',ty:''},last:Date.now()};

const gi=id=>S.issues.find(i=>i.id==id),gw=id=>S.wos.find(w=>w.id==id);
let WIB=new Map();   // issue_id -> work order, rebuilt on hydrate (avoids a linear scan per issue)
const wOf=iid=>WIB.get(iid);
const overdue=w=>w.dl<day(0)&&w.st!='Resolved';
/* ---- API client: S is a cache of what the server returned (hydrate after every action) ---- */
const api=async(m,u,b)=>{const o={method:m,credentials:'same-origin'};if(b instanceof FormData)o.body=b;else if(b){o.headers={'content-type':'application/json'};o.body=JSON.stringify(b)}
 const r=await fetch(u,o),j=await r.json().catch(()=>({}));
 if(r.status==401&&S.me){S.me=null;location.hash='#/login';go();throw new Error('Session expired. Please log in again.')}
 if(!r.ok)throw new Error(j.error||'Request failed');return j};
const ST={OPEN:'Open',IN_PROGRESS:'In-Progress',RESOLVED:'Resolved',CLOSED:'Closed'},CT=s=>s[0]+s.slice(1).toLowerCase();
async function hydrate(){const d=await api('GET','/api/bootstrap');
 USERS.length=0;USERS.push(...d.users.map(u=>({id:u.user_id,name:u.name,email:u.email,role:u.role})));
 const ph={};for(const p of d.photos)(ph[p.issue_id]??=[]).push({name:p.file_name,url:'/api/photos/'+p.photo_id});
 S.issues=d.issues.map(i=>({id:i.issue_id,uid:i.user_id,title:i.title,cat:CT(i.category),loc:i.location,desc:i.description,st:ST[i.status],fb:i.closure_feedback,at:i.submitted_at,photos:ph[i.issue_id]??[]}));
 S.wos=d.workOrders.map(w=>({id:w.work_order_id,iid:w.issue_id,details:w.work_details,type:CT(w.assignment_type),who:w.assigned_person_name,pr:CT(w.priority),dl:w.deadline,st:CT(w.status),note:w.resolution_note,at:w.created_at}));
 WIB=new Map(S.wos.map(w=>[w.iid,w]));
 S.pu=d.updates.map(p=>({wo:p.work_order_id,d:p.description,at:p.updated_at}));
 S.notes=d.notifications.map(n=>({id:n.notification_id,uid:S.me.id,iid:n.issue_id,m:n.message,read:n.is_read,at:n.created_at}))}
const svc={
 async create(d){const f=new FormData();f.set('title',d.title);f.set('category',d.cat.toUpperCase());f.set('location',d.loc);f.set('description',d.desc);f.set('ack','true');S.photos.forEach(p=>f.append('photos',p.file));
  const r=await api('POST','/api/issues',f);await hydrate();return{id:r.issue.issue_id}},
 async close(id,fb){await api('POST',`/api/issues/${id}/close`,{feedback:fb});await hydrate()},
 async createWO(id,d){await api('POST',`/api/issues/${id}/work-order`,{work_details:d.details,assignment_type:d.type.toUpperCase(),assigned_person_name:d.who.trim()||undefined,priority:d.pr.toUpperCase(),deadline:d.dl});await hydrate()},
 async updateWO(id,d){await api('PATCH','/api/work-orders/'+id,{work_details:d.details.trim(),priority:d.pr.toUpperCase(),deadline:d.dl,assigned_person_name:d.who.trim(),progress:d.p.trim()||undefined});await hydrate()},
 async resolve(id){await api('POST',`/api/issues/${id}/resolve`);await hydrate()},
 async addUser(d){const r=await api('POST','/api/users',{name:d.name,email:d.email,password:d.pw,role:d.role=='Administrator'?'ADMINISTRATOR':'END_USER'});await hydrate();return r.user},
 async updateUser(id,d){await api('PATCH','/api/users/'+id,{name:d.name,email:d.email,password:d.pw||undefined,role:d.role=='Administrator'?'ADMINISTRATOR':'END_USER'});await hydrate()}};
const act=async(fn,ok)=>{try{await fn();if(ok)toast(ok);go()}catch(e){toast(e.message,1)}};
function toast(m,e){const t=document.getElementById('toast');t.innerHTML=`<div role="status" class="px-4 py-2 rounded-xl text-sm shadow-lg ${e?'bg-rose-500/20 text-rose-200 border border-rose-400/40':'bg-cyan-500/20 text-cyan-100 border border-cyan-400/40'} backdrop-blur">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',3500)}
/* ---- ui bits ---- */
const BC={Open:'bg-indigo-400 text-black','In-Progress':'bg-purple-400 text-black',Resolved:'bg-cyan-400 text-black',Closed:'bg-rose-400 text-black'};
const badge=s=>`<span class="px-2.5 py-0.5 rounded-full text-xs font-medium whitespace-nowrap ${BC[s]}">${s}</span>`;
const card='bg-[#0a0a0a] border border-white/10 rounded-2xl p-5',inp='w-full rounded-xl bg-white/[.04] border border-white/10 px-3 py-2 text-sm',
 btn='g text-black font-semibold rounded-xl px-4 py-2 text-sm hover:opacity-90',btn2='border border-white/15 rounded-xl px-4 py-2 text-sm hover:bg-white/5';
const lbl=(t,x)=>`<label class="block text-sm text-zinc-300 mb-1">${t}</label>${x}`;
const err=n=>`<p id="e-${n}" class="text-rose-400 text-xs mt-1" role="alert"></p>`;
const empty=t=>`<p class="text-zinc-500 text-sm py-8 text-center">${t}</p>`;
const row=(href,a,b,c,d)=>`<a href="#/${href}" class="flex flex-wrap items-center gap-x-3 gap-y-1 rounded-xl px-3 py-3 hover:bg-white/5 border border-white/5 mb-2"><span class="text-xs text-zinc-400 w-16">${a}</span><span class="flex-1 min-w-[40%] text-sm font-medium">${b}</span><span class="text-xs text-zinc-400 w-full sm:w-auto">${c}</span>${d}</a>`;
const page=(t,b)=>`<main class="max-w-6xl mx-auto px-4 py-6"><h1 class="text-2xl font-semibold mb-5">${t}</h1>${b}</main>`;
/* ---- views ---- */
function login(){
 const f='w-full rounded-xl bg-black/40 border border-white/10 pl-10 pr-3 py-2.5 text-sm placeholder-zinc-600 focus:border-violet-400';
 const logo='<span class="inline-flex items-center gap-2 font-bold tracking-wider">'+ic.logo+'RESOLVE</span>';
 const chip=t=>`<li class="flex items-center gap-3 text-sm text-zinc-300"><span class="w-6 h-6 grid place-items-center rounded-full g text-black text-xs font-bold" aria-hidden="true">✓</span>${t}</li>`;
 return `<div class="min-h-screen grid lg:grid-cols-2 relative overflow-hidden">
 <div class="pointer-events-none absolute -top-40 -left-40 w-[34rem] h-[34rem] rounded-full blur-3xl opacity-25" style="background:#a78bfa"></div>
 <div class="pointer-events-none absolute -bottom-48 -right-32 w-[30rem] h-[30rem] rounded-full blur-3xl opacity-20" style="background:#f0abfc"></div>
 <section class="hidden lg:flex flex-col justify-center px-16 relative"><div class="mb-10 text-lg">${logo}</div>
  <h1 class="text-5xl font-semibold leading-tight">Report it.<br>Track it.<br><span class="gt">Resolve it.</span></h1>
  <p class="text-zinc-400 mt-5 max-w-md">Fixing today's problems before they become tomorrow's disasters. One place for campus infrastructure issues and the work that fixes them.</p>
  <ul class="mt-8 space-y-3">${chip('Report a fault in under a minute')}${chip('Follow every work order to completion')}${chip('Always see the latest status and progress')}</ul></section>
 <section class="flex items-center justify-center p-6 relative">
  <form onsubmit="return doLogin(event)" class="w-full max-w-sm rounded-3xl border border-white/10 bg-white/[.04] backdrop-blur-xl p-8 space-y-5 shadow-2xl shadow-violet-500/10">
   <div class="lg:hidden text-center">${logo}</div>
   <div><h2 class="text-2xl font-semibold">Welcome back</h2><p class="text-sm text-zinc-500 mt-1">Log in to continue to Resolve</p></div>
   <div><label for="em" class="block text-xs text-zinc-300 mb-1.5">Email</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" aria-hidden="true">✉</span>
    <input id="em" name="email" type="email" required autocomplete="username" placeholder="you@nitc.ac.in" class="${f}"></div></div>
   <div><label for="pw" class="block text-xs text-zinc-300 mb-1.5">Password</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-zinc-500" aria-hidden="true">🔒</span>
    <input id="pw" name="pw" type="password" required autocomplete="current-password" placeholder="••••••••" class="${f}">
    <button type="button" aria-label="Show or hide password" onclick="const p=this.previousElementSibling;p.type=p.type=='password'?'text':'password'" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs text-zinc-500 hover:text-white px-2 py-1 rounded">Show</button></div></div>
   <p id="e-login" class="text-rose-400 text-xs min-h-[1rem]" role="alert"></p>
   <button class="g text-black font-semibold rounded-xl w-full py-2.5 hover:opacity-90">Log in</button>
   <p class="text-center text-[11px] text-zinc-600">NIT Calicut · Campus Infrastructure Issue &amp; Work-Order Tracker</p>
  </form></section></div>`}
async function doLogin(e){e.preventDefault();const f=new FormData(e.target);
 try{const r=await api('POST','/api/login',{email:f.get('email'),password:f.get('pw')});S.me={id:r.user.user_id,name:r.user.name,role:r.user.role=='ADMINISTRATOR'?'A':'U'};S.last=Date.now();await hydrate();location.hash=S.me.role=='A'?'#/dash':'#/home';go()}
 catch(x){document.getElementById('e-login').textContent=x.message}return false}
async function logout(){await api('POST','/api/logout').catch(()=>{});S.me=null;location.hash='#/login';go()}
async function addPhotos(inp){
 const e=document.getElementById('e-ph');e.textContent='';
 for(const f of inp.files){
  if(S.photos.length>=3){e.textContent='Photos: a maximum of 3 images is allowed.';break}
  if(!['image/jpeg','image/png'].includes(f.type)){e.textContent=`Photos: "${f.name}" must be JPEG or PNG.`;continue}
  if(f.size>5*1048576){e.textContent=`Photos: "${f.name}" exceeds 5 MB.`;continue}
  const b=new Uint8Array(await f.slice(0,4).arrayBuffer()),jp=b[0]==255&&b[1]==216&&b[2]==255,pn=b[0]==137&&b[1]==80&&b[2]==78&&b[3]==71;
  if(!(jp||pn)){e.textContent=`Photos: "${f.name}" is not a valid image file.`;continue}
  const url=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.readAsDataURL(f)});S.photos.push({name:f.name,url,file:f})}
 inp.value='';document.getElementById('ph').innerHTML=S.photos.map((p,i)=>`<div class="relative"><img src="${p.url}" alt="${esc(p.name)}" class="w-16 h-16 object-cover rounded-lg"><button type="button" aria-label="Remove ${esc(p.name)}" onclick="S.photos.splice(${i},1);this.parentNode.remove()" class="absolute -top-1 -right-1 bg-rose-500 rounded-full w-5 h-5 text-xs">×</button></div>`).join('')}
function submitIssue(e){e.preventDefault();const f=new FormData(e.target),v=k=>(f.get(k)||'').toString().trim(),E={};
 if(!v('title')||v('title').length>100)E.title='Title: enter 1–100 characters.';
 if(!CATS.includes(v('cat')))E.cat='Category: please choose one.';
 if(!v('loc'))E.loc='Location: this field is required.';
 if(!v('desc')||v('desc').length>500)E.desc='Description: enter 1–500 characters.';
 if(!f.get('ack'))E.ack='Please acknowledge the privacy notice to submit.';
 ['title','cat','loc','desc','ack'].forEach(k=>document.getElementById('e-'+k).textContent=E[k]||'');
 if(Object.keys(E).length)return false;
 act(async()=>{const i=await svc.create({title:v('title'),cat:v('cat'),loc:v('loc'),desc:v('desc'),photos:S.photos.slice()});S.photos=[];toast('Request submitted. Your Issue ID is '+i.id)});return false}
function reqDetail(id){
 const i=gi(id);if(!i||i.uid!=S.me.id)return page('Not found',`<p class="text-zinc-400">This request does not exist or you do not have access to it.</p>`);
 const w=wOf(id),pu=w?S.pu.filter(p=>p.wo==w.id).reverse():[];
 return page(`${i.id} · ${esc(i.title)}`,`<div class="grid lg:grid-cols-2 gap-5"><section class="${card} space-y-2 text-sm">${badge(i.st)}${kv('Category',i.cat)}${kv('Location',esc(i.loc))}${kv('Submitted',fmt(i.at))}<p class="text-zinc-300 pt-2">${esc(i.desc)}</p>${photos(i)}
 ${i.fb?`<p class="mt-3 p-3 rounded-xl bg-rose-500/10 text-rose-200"><b>Closure feedback:</b> ${esc(i.fb)}</p>`:''}
 ${i.st=='In-Progress'?`<button class="${btn} mt-3" onclick="confirm('Mark this issue as resolved? This cannot be undone.')&&act(()=>svc.resolve('${i.id}'),'Marked as resolved')">Mark as Resolved</button>`:''}</section>
 <section class="${card}"><h2 class="font-semibold mb-2">Work order</h2>${w?`<div class="space-y-1 text-sm">${kv('ID',w.id)}${kv('Status',w.st)}${kv('Assigned to',esc(w.who||'To be confirmed')+' ('+w.type+')')}${kv('Deadline',fd(w.dl)+(overdue(w)?' · <span class="text-rose-400">overdue</span>':''))}${w.note?kv('Resolution',esc(w.note)):''}</div>
 <h3 class="font-medium mt-4 mb-2 text-sm">Progress updates</h3>${pu.length?pu.map(p=>`<div class="border-l-2 border-violet-400/50 pl-3 mb-3 text-sm">${esc(p.d)}<div class="text-xs text-zinc-500">${fmt(p.at)}</div></div>`).join(''):empty('No progress recorded yet.')}`:empty('No work order yet. An administrator will review your request.')}</section></div>`)}
const kv=(k,v)=>`<div class="flex gap-3"><span class="text-zinc-500 w-28 shrink-0">${k}</span><span>${v}</span></div>`;
const photos=i=>i.photos?.length?`<div class="flex gap-2 pt-2">${i.photos.map(p=>`<img src="${p.url}" alt="${esc(p.name)}" class="w-20 h-20 object-cover rounded-lg">`).join('')}</div>`:'';
function notes(){const n=S.notes.filter(n=>n.uid==S.me.id).sort((a,b)=>b.at<a.at?-1:1);
 return page('Notifications',`<div class="${card}">${n.length?n.map(x=>`<a href="#/req/${x.iid}" onclick="api('POST','/api/notifications/${x.id}/read').catch(()=>{});S.notes.find(n=>n.id=='${x.id}').read=true" class="flex items-center gap-3 px-3 py-3 rounded-xl hover:bg-white/5 border-b border-white/5 text-sm ${x.read?'text-zinc-500':''}">${x.read?'':'<span class="w-2 h-2 rounded-full g"></span>'}<span class="flex-1">${esc(x.m)}</span><span class="text-xs">${fmt(x.at)}</span></a>`).join(''):empty('You are all caught up.')}</div>`)}
/* ---- admin ---- */
function issues(){const f=S.f;
 return page('Issues',`<div class="grid sm:grid-cols-4 gap-2 mb-4"><input aria-label="Search by ID or title" placeholder="Search ID or title" value="${esc(f.q)}" oninput="S.f.q=this.value;lst()" class="${inp}">
 <select aria-label="Status" onchange="S.f.st=this.value;lst()" class="${inp}"><option value="">All statuses</option>${['Open','In-Progress','Resolved','Closed'].map(s=>`<option ${f.st==s?'selected':''}>${s}</option>`).join('')}</select>
 <select aria-label="Category" onchange="S.f.cat=this.value;lst()" class="${inp}"><option value="">All categories</option>${CATS.map(s=>`<option ${f.cat==s?'selected':''}>${s}</option>`).join('')}</select>
 <select aria-label="Priority" onchange="S.f.pr=this.value;lst()" class="${inp}"><option value="">Any priority</option>${PRI.map(s=>`<option ${f.pr==s?'selected':''}>${s}</option>`).join('')}</select></div><div id="lst" class="${card}"></div>`)}
function lst(){const f=S.f,q=f.q.toLowerCase(),r=S.issues.filter(i=>(!q||i.id.toLowerCase().includes(q)||i.title.toLowerCase().includes(q))&&(!f.st||i.st==f.st)&&(!f.cat||i.cat==f.cat)&&(!f.pr||wOf(i.id)?.pr==f.pr));
 document.getElementById('lst').innerHTML=r.length?r.map(i=>row('issue/'+i.id,i.id,esc(i.title),esc(i.loc)+' · '+i.cat,badge(i.st))).join(''):empty('No issues match these filters.')}
function issueDetail(id){const i=gi(id);if(!i)return page('Not found','');const w=wOf(id),u=USERS.find(u=>u.id==i.uid);
 return page(`${i.id} · ${esc(i.title)}`,`<div class="grid lg:grid-cols-2 gap-5"><section class="${card} space-y-2 text-sm">${badge(i.st)}${kv('Submitted by',esc(u.name))}${kv('Category',i.cat)}${kv('Location',esc(i.loc))}${kv('Submitted',fmt(i.at))}<p class="text-zinc-300 pt-2">${esc(i.desc)}</p>${photos(i)}${i.fb?`<p class="p-3 rounded-xl bg-rose-500/10 text-rose-200">Feedback sent: ${esc(i.fb)}</p>`:''}${w?`<a class="${btn2} inline-block mt-2" href="#/wo/${w.id}">Open ${w.id}</a>`:''}</section>
 ${i.st=='Open'?`<div class="space-y-5"><form onsubmit="return mkWO(event,'${i.id}')" class="${card} space-y-3"><h2 class="font-semibold">Create Work Order</h2><p class="text-xs text-amber-300/90">Contact maintenance by phone first, then record the confirmed details here.</p>
 <div>${lbl('Work details *','<textarea name="details" rows="3" class="'+inp+'"></textarea>')}</div>
 <div class="grid grid-cols-2 gap-3"><div>${lbl('Assignment type','<select name="type" class="'+inp+'"><option>Internal</option><option>External</option></select>')}</div><div>${lbl('Priority','<select name="pr" class="'+inp+'">'+PRI.map(p=>`<option ${p=='Medium'?'selected':''}>${p}</option>`).join('')+'</select>')}</div>
 <div>${lbl('Assignee name (optional)','<input name="who" class="'+inp+'">')}</div><div>${lbl('Target date *','<input type="date" name="dl" min="'+day(0)+'" class="'+inp+'">')}</div></div><button class="${btn}">Create Work Order</button></form>
 <form onsubmit="return cl(event,'${i.id}')" class="${card} space-y-3"><h2 class="font-semibold">Close Issue</h2>${lbl('Feedback (optional)','<textarea name="fb" rows="2" class="'+inp+'"></textarea>')}<button class="${btn2}">Close Issue</button></form></div>`:''}</div>`)}
const mkWO=(e,id)=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));act(()=>svc.createWO(id,{details:f.details,type:f.type,who:f.who,pr:f.pr,dl:f.dl}),'Work order created');return false};
const cl=(e,id)=>{e.preventDefault();if(confirm('Close this issue? This is final.'))act(()=>svc.close(id,new FormData(e.target).get('fb')),'Issue closed');return false};
function wos(){const f=S.wf;
 return page('Work Orders',`<div class="grid sm:grid-cols-4 gap-2 mb-4"><input aria-label="Search by work-order ID, issue ID, details or assignee" placeholder="Search ID, issue or assignee" value="${esc(f.q)}" oninput="S.wf.q=this.value;wolst()" class="${inp}">
 <select aria-label="Status" onchange="S.wf.st=this.value;wolst()" class="${inp}"><option value="">All statuses</option>${['Assigned','Resolved','Overdue'].map(s=>`<option ${f.st==s?'selected':''}>${s}</option>`).join('')}</select>
 <select aria-label="Priority" onchange="S.wf.pr=this.value;wolst()" class="${inp}"><option value="">Any priority</option>${PRI.map(s=>`<option ${f.pr==s?'selected':''}>${s}</option>`).join('')}</select>
 <select aria-label="Assignment type" onchange="S.wf.ty=this.value;wolst()" class="${inp}"><option value="">Any type</option>${['Internal','External'].map(s=>`<option ${f.ty==s?'selected':''}>${s}</option>`).join('')}</select></div><div id="wol" class="${card}"></div>`)}
const woRow=w=>row('wo/'+w.id,w.id,esc(w.details),esc(w.who||'Unassigned')+' · '+w.pr+' · due '+fd(w.dl),overdue(w)?'<span class="px-2.5 py-0.5 rounded-full text-xs bg-rose-500/20 text-rose-300">Overdue</span>':badge(w.st=='Resolved'?'Resolved':'In-Progress'));
function wolst(){const f=S.wf,q=f.q.toLowerCase(),r=S.wos.slice().reverse().filter(w=>(!q||w.id.toLowerCase().includes(q)||w.iid.toLowerCase().includes(q)||w.details.toLowerCase().includes(q)||(w.who||'').toLowerCase().includes(q))
 &&(!f.st||(f.st=='Overdue'?overdue(w):w.st==f.st))&&(!f.pr||w.pr==f.pr)&&(!f.ty||w.type==f.ty));
 document.getElementById('wol').innerHTML=r.length?r.map(woRow).join(''):empty('No work orders match these filters.')}
function woDetail(id){const w=gw(id);if(!w)return page('Not found','');const pu=S.pu.filter(p=>p.wo==id).reverse();
